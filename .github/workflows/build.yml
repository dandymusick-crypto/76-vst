name: Build Dandy 76 VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar VST3
        run: cmake --build build --config Release

      - name: Empaquetar Dandy 76 VST3 listo para Ableton
        uses: actions/upload-artifact@v4
        with:
          name: Dandy-76-VST3-Windows
          path: build/Dandy76_artefacts/Release/VST3/Dandy 76.vst3
